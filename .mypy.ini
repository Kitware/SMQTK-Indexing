###############################################################################
# Global Options

[mypy]
# Files/Directories to investigate.
files = smqtk_indexing, tests

# Disable caching
incremental = False

# Disallows defining functions without type annotations or with incomplete type
# annotations.
disallow_untyped_defs = True

###############################################################################
# Options for different parts of SMQTK-Indexing

;[mypy-smqtk_indexing.*]

[mypy-tests.*]
# Test fixtures intentionally provide empty implementations replaced by mocks.
disable_error_code = empty-body

###############################################################################
# TPL-module options

[mypy-numpy.*]
ignore_missing_imports = True
# Keep the legacy array annotations dynamic while checking SMQTK code.
follow_imports = skip
follow_imports_for_stubs = True

[mypy-pytest]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = True

[mypy-faiss.*]
ignore_missing_imports = True
# Faiss's generated C++ stubs omit its NumPy wrapper overloads.
follow_imports = skip
follow_imports_for_stubs = True

[mypy-scipy.*]
ignore_missing_imports = True
